<!DOCTYPE html>
<html>
<head>
  <title>My Animal Fact File</title>
  <style>

    /* Page background — sets the colour and font for the whole page */
    body {
      background-color: #2b0a0a;
      font-family: Arial, sans-serif;
    }

    /* Box Model */
    .fact-file {
      background-color: #fff3e0;
      color: #4e342e;
      width: 260px;
      padding: 25px;
      border: 4px solid #d84315;
      margin: 30px;
    }

    /* Animal name */
    .animal-name {
      color: #bf360c;
      font-size: 22px;
    }

    /* Detail rows */
    .detail {
      color: #5d4037;
    }

    /* Cool fact */
    .cool-fact {
      color: #ff6f00;
      font-style: italic;
    }

  </style>
</head>
<body>

  <div class="fact-file">
    <h2 class="animal-name">Dragon</h2>
    <p class="detail">Type: Mythical Creature</p>
    <p class="detail">Lives in: Ancient mountain caves</p>
    <p class="detail">Diet: Giant fish, wild boars, and treasure hunters</p>
    <p class="cool-fact">Cool Fact: Its fiery breath can melt solid rock in seconds!</p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Card</title>
  <style>

    body {
      background-color: darkblue;
      color: white;
      font-family: Arial, sans-serif;
    }
    .myname{
        color: brown;
        text-decoration: underline;
    }
    .skill{
        color: burlywood;
        font-style: italic;
        font-weight: bold;
        text-decoration: line-through;
    }
    .students{
        text-transform: uppercase;
    }
    .badge{
        text-shadow: 3px 3px black;
        transform: scale(2);
    }
   
  </style>
</head>
<body>


  <h1 class = "myname">Hi I am Nikita, I teach students accross the world!</h1>
  <h1 class = "skill">I love coding and teaching it in a fun way!</h1>
  <h1 class="students">My students are from Pakistan.</h1>
  <h2 class = "badge">HELLLOOOOOOOO</h2>

</body>
</html>

<!DOCTYPE html>

<html>

<body>

  <h1>Food Order Details</h1>

  <form>
    <fieldset>
      <legend>Food Information:</legend>

      <label>Customer First Name:</label>
      <input type="text" id="fname" name="fname"><br><br>

      <label>Customer Last Name:</label>
      <input type="text" id="lname" name="lname"><br><br>

      <label>Food Preference:</label><br><br>

      <input type="radio" name="subject" value="Veg"> Vegetarian<br><br>
      <input type="radio" name="subject" value="NonVeg"> Non-Vegetarian<br><br>
      <input type="radio" name="subject" value="Dessert"> Desserts<br><br>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email"><br><br>

      <label for="email">Order Password:</label>
      <input type="password" name="password"><br><br>

      <label for="birthday">Delivery Date:</label>
      <input type="date" id="birthday" name="birthday"><br><br>

      <label for="email">Delivery Address:</label><br />
      <textarea rows="5" cols="50" name="description">Enter your address here...</textarea><br><br>

      <label for="email">Upload Favourite Food Image:</label><br><br>
      <input type="file" name="fileupload" accept="image/*" /><br><br><br><br>

      <center>
        <input type="submit" name="submit" value="Place Order" />
        <input type="reset" name="reset" value="Clear Form" />
      </center>

    </fieldset>
  </form>

</body>

</html>

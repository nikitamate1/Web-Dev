<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Food Order Form</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
	  <form>
		  <fieldset>
			  <!-- The fieldset tag is used to group related elements in a form and draws a box around them-->
			  <legend>Food Order Information:</legend>

			  <label>Customer Name:</label>
			  <!--placeholder attribute can be used to provide extra information about entry to be made-->
			  <input type="text" id="fname" placeholder="Enter Customer Name"><br><br>

			  <label>Email Address:</label>
			  <input type="text" id="email"><br><br>

			  <label>Meal Preference:</label><br>
			  <input type="radio" id="vegetarian" name="meal" value="vegetarian">Vegetarian<br>
			  <input type="radio" id="nonvegetarian" name="meal" value="nonvegetarian">Non-Vegetarian<br><br>

			  <label>Delivery Date:</label>
			  <input type="date" id="birthday" name="birthday"><br><br>
				
			  <input type="submit" value="Submit">


		  </fieldset>
	  </form>
  </body>
</html>

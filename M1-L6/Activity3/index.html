<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My Food Order</title>
  </head>
  <body>

    <h1>🍔 My Food Order</h1>
    <p>Fill in the form below to place your food order!</p>
    <hr>

    <form>

      <fieldset>
        <legend>Customer Details</legend>

        <label>Your Name</label><br>
        <input type="text" id="name" placeholder="Enter your full name"><br><br>

        <label>Coupon Code</label><br>
        <input type="password" id="coupon" placeholder="Enter your coupon code"><br><br>

        <label>Order Date</label><br>
        <input type="date" id="date"><br>

      </fieldset>

      <br>

      <fieldset>
        <legend>Your Order</legend>

        <label>Choose Your Meal</label><br>
        <select id="meal">
          <option value="">-- Select a meal --</option>
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="pasta">Pasta</option>
        </select><br><br>

        <label>Meal Type</label><br>
        <input type="radio" name="mealtype" value="veg"> Vegetarian<br>
        <input type="radio" name="mealtype" value="nonveg"> Non-Vegetarian<br><br>

        <label>Special Instructions</label><br>
        <textarea id="notes" rows="3" cols="35" placeholder="e.g. Less spicy, extra cheese."></textarea><br>

      </fieldset>

      <br>

      <fieldset>
        <legend>Extra Items</legend>

        <input type="checkbox" value="fries"> French Fries<br>
        <input type="checkbox" value="drink"> Soft Drink<br>
        <input type="checkbox" value="dessert"> Dessert<br>

      </fieldset>

      <br>
      <input type="submit" value="Place My Order">

    </form>

  </body>
</html>

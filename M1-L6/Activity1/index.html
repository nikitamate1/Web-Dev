<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Food Form</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Food Preferences Form</h1>

    <form>
      <label>Customer Name</label><br>
      <input type="text" id="name"><br><br>

      <label>Email Address</label><br>
      <input type="text" id="email"><br><br>

      <label>Secret Food Coupon Code</label><br>
      <input type="password" id="contact"><br><br>

      <label>Favourite Meal Type</label><br>
      <input type="radio" id="female" name="gender" value="Vegetarian">Vegetarian<br>
      <input type="radio" id="male" name="gender" value="Non-Vegetarian">Non-Vegetarian<br><br>

      <label>Favourite Food</label><br>
      <input type="checkbox" id="city" value="Pizza">Pizza<br>
      <input type="checkbox" id="city" value="Burger">Burger<br><br>

      <input type="submit">
    </form>

  </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Food Form</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

    <h1>Food Preferences Form</h1>

    <form>

        <label for="name">Customer Name</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="coupon">Secret Food Coupon Code</label><br>
        <input type="password" id="coupon" name="coupon"><br><br>

        <label>Favourite Meal Type</label><br>

        <input type="radio" id="vegetarian" name="meal" value="Vegetarian">
        <label for="vegetarian">Vegetarian</label><br>

        <input type="radio" id="nonvegetarian" name="meal" value="Non-Vegetarian">
        <label for="nonvegetarian">Non-Vegetarian</label><br><br>

        <label>Favourite Food</label><br>

        <input type="checkbox" id="pizza" name="food" value="Pizza">
        <label for="pizza">Pizza</label><br>

        <input type="checkbox" id="burger" name="food" value="Burger">
        <label for="burger">Burger</label><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
